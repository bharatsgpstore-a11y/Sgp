  <!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bharat Mart - Ultimate Shopping</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root { --primary: #2874f0; --secondary: #fb641b; --green: #388e3c; --bg: #f1f3f6; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg); }

        /* Header */
        .header { background: var(--primary); color: white; padding: 12px 15px; position: sticky; top: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: center; }
        .menu-btn { font-size: 1.3rem; cursor: pointer; }
        
        /* Category Bar (Flipkart Style) */
        .category-bar { background: white; display: flex; overflow-x: auto; padding: 10px 5px; gap: 15px; border-bottom: 1px solid #ddd; position: sticky; top: 48px; z-index: 900; }
        .category-bar::-webkit-scrollbar { display: none; }
        .cat-item { display: flex; flex-direction: column; align-items: center; min-width: 80px; cursor: pointer; }
        .cat-item i { background: #f0f5ff; color: var(--primary); width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 4px; font-size: 1.1rem; }
        .cat-item span { font-size: 0.75rem; font-weight: 500; color: #444; }

        /* Sidebar Menu */
        .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: white; z-index: 9000; transition: 0.3s; box-shadow: 2px 0 10px rgba(0,0,0,0.2); }
        .sidebar.active { left: 0; }
        .sidebar-header { background: var(--primary); color: white; padding: 20px; font-weight: 600; font-size: 1.1rem; }
        .menu-link { padding: 15px 20px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 15px; color: #333; cursor: pointer; }
        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 8500; }

        /* Language Selector Fix */
        #google_translate_element { padding: 10px 20px; border-bottom: 1px solid #eee; }

        /* Grid */
        .container { padding: 12px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
        .card { background: white; border-radius: 10px; padding: 12px; text-align: center; border: 1px solid #eee; transition: 0.2s; }
        .card:active { transform: scale(0.96); }
        .card img { width: 100%; height: 130px; object-fit: contain; }
        .card h4 { font-size: 0.85rem; margin-top: 10px; color: #333; height: 38px; overflow: hidden; }
        .price { color: var(--green); font-weight: 600; font-size: 1.1rem; margin-top: 5px; }

        /* Modals */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 9500; overflow-y: auto; }
        .modal-header { padding: 15px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 15px; position: sticky; top: 0; background: white; }
        .form-box { padding: 20px; }
        .input-group { margin-bottom: 15px; }
        .input-group input, .input-group textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-top: 5px; }
        
        .btn-action { width: 100%; background: var(--secondary); color: white; border: none; padding: 16px; font-weight: 600; position: fixed; bottom: 0; cursor: pointer; }
        .btn-success { width: 100%; background: var(--green); color: white; border: none; padding: 15px; font-weight: 600; border-radius: 8px; margin-top: 10px; }
    </style>
</head>
<body>

    <header class="header">
        <div class="menu-btn" onclick="toggleMenu()"><i class="fas fa-ellipsis-v"></i></div>
        <div style="font-weight:600; letter-spacing:1px;">BHARAT MART</div>
        <div style="position:relative;"><i class="fas fa-shopping-bag fa-lg"></i></div>
    </header>

    <div class="category-bar">
        <div class="cat-item" onclick="filter('all')"><i class="fas fa-th"></i><span>All Items</span></div>
        <div class="cat-item" onclick="filter('kitchen')"><i class="fas fa-blender"></i><span>Kitchen</span></div>
        <div class="cat-item" onclick="filter('electronics')"><i class="fas fa-mobile-alt"></i><span>Electronics</span></div>
        <div class="cat-item" onclick="filter('home')"><i class="fas fa-lamp"></i><span>Home Acc.</span></div>
        <div class="cat-item" onclick="filter('plastic')"><i class="fas fa-recycle"></i><span>Plastic</span></div>
    </div>

    <div class="sidebar-overlay" id="overlay" onclick="toggleMenu()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">Menu Options</div>
        <div id="google_translate_element"></div>
        <div class="menu-link" onclick="window.open('https://wa.me/917348698707')"><i class="fas fa-undo"></i> Return & Refund</div>
        <div class="menu-link" onclick="window.open('https://wa.me/917348698707')"><i class="fas fa-phone-alt"></i> Contact Support</div>
    </div>

    <div class="container">
        <h4 id="catTitle" style="margin-bottom: 10px; color: #777;">Showing: All Products</h4>
        <div class="grid" id="productGrid"></div>
    </div>

    <div class="modal" id="pModal">
        <div class="modal-header">
            <i class="fas fa-arrow-left fa-lg" onclick="closeM('pModal')"></i>
            <span style="font-weight:600;">Item Description</span>
        </div>
        <div style="padding:20px; text-align:center; padding-bottom: 80px;">
            <img id="mImg" style="width:100%; height:250px; object-fit:contain;">
            <h2 id="mName" style="margin-top:15px; font-weight:500;"></h2>
            <h1 id="mPrice" style="color:var(--primary); margin:10px 0;"></h1>
            <p id="mDesc" style="color:#666; font-size:0.9rem; line-height:1.5;"></p>
        </div>
        <button class="btn-action" onclick="openCheckout()">PROCEED TO ORDER</button>
    </div>

    <div class="modal" id="checkoutModal">
        <div class="modal-header">
            <i class="fas fa-arrow-left fa-lg" onclick="closeM('checkoutModal')"></i>
            <span style="font-weight:600;">Delivery Details</span>
        </div>
        <div class="form-box">
            <div style="background:#eef; padding:10px; border-radius:8px; margin-bottom:15px;">
                <p><strong>Ordering:</strong> <span id="cItem"></span></p>
                <p><strong>Amount:</strong> <span id="cPrice"></span></p>
            </div>
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Apna naam likhein">
            </div>
            <div class="input-group">
                <label>Full Address</label>
                <textarea id="addr" rows="3" placeholder="Ghar ka pata, Landmark ke sath"></textarea>
            </div>
            <div class="input-group">
                <label>Pincode</label>
                <input type="number" id="pin" placeholder="6-digit pincode">
            </div>
            <button class="btn-success" onclick="finalOrder()">CONFIRM & SEND ON WHATSAPP</button>
        </div>
    </div>

    <script>
        const products = [
            // Kitchen Items
            { id: 1, cat: 'kitchen', name: "20L Strong Plastic Bucket", price: 150, desc: "Buraq brand high quality durable bucket.", img: "https://images.unsplash.com/photo-1584622650111-993a426fbf0a?w=400" },
            { id: 2, cat: 'kitchen', name: "Airtight Spice Box Set", price: 320, desc: "6-piece set to keep spices fresh and safe.", img: "https://images.unsplash.com/photo-1591195853828-11db59a44f6b?w=400" },
            { id: 3, cat: 'kitchen', name: "Plastic Water Jug (2.5L)", price: 99, desc: "Elegant design jug with strong handle.", img: "https://m.media-amazon.com/images/I/61NlBvYy-9L._SL1500_.jpg" },

            // Electronics Items
            { id: 4, cat: 'electronics', name: "High Power Rechargeable Torch", price: 249, desc: "High range LED flashlight for home use.", img: "https://m.media-amazon.com/images/I/61M9B4N-OML._SL1100_.jpg" },
            { id: 5, cat: 'electronics', name: "Universal Smartphone Tripod", price: 180, desc: "Perfect for vlogging and YouTube videos.", img: "https://m.media-amazon.com/images/I/61m9-L-Y1vL._SL1100_.jpg" },
            { id: 6, cat: 'electronics', name: "Bluetooth Wireless Earbuds", price: 499, desc: "Deep bass and 20 hours battery backup.", img: "https://m.media-amazon.com/images/I/510+-7V77DL._SL1500_.jpg" },

            // Home Accessories
            { id: 7, cat: 'home', name: "Anti-Slip Aesthetic Door Mat", price: 120, desc: "Soft microfibre mat with beautiful pattern.", img: "https://images.unsplash.com/photo-1588600878108-578307a3cc9d?w=400" },
            { id: 8, cat: 'home', name: "Wall Hanging Key Holder", price: 150, desc: "Wooden finish stylish holder for keys.", img: "https://m.media-amazon.com/images/I/71R2o58RzYL._SL1500_.jpg" },
            { id: 9, cat: 'home', name: "Foldable Laundry Basket", price: 210, desc: "Nylon mesh basket to keep clothes organized.", img: "https://m.media-amazon.com/images/I/71M0G7x3G-L._SL1500_.jpg" },

            // Plastic Items
            { id: 10, cat: 'plastic', name: "Multipurpose Plastic Stool", price: 190, desc: "Lightweight and strong stool for daily use.", img: "https://m.media-amazon.com/images/I/61-z8zX90xL._SL1500_.jpg" }
        ];

        let selected = null;

        function render(items) {
            document.getElementById('productGrid').innerHTML = items.map(p => `
                <div class="card" onclick="openDetails(${p.id})">
                    <img src="${p.img}">
                    <h4>${p.name}</h4>
                    <p class="price">₹${p.price}</p>
                </div>
            `).join('');
        }

        function filter(cat) {
            const filtered = cat === 'all' ? products : products.filter(p => p.cat === cat);
            render(filtered);
            document.getElementById('catTitle').innerText = "Showing: " + cat.toUpperCase();
            if(window.innerWidth < 600) toggleMenu(); 
        }

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            const overlay = document.getElementById('overlay');
            overlay.style.display = overlay.style.display === 'block' ? 'none' : 'block';
        }

        function openDetails(id) {
            selected = products.find(p => p.id === id);
            document.getElementById('mImg').src = selected.img;
            document.getElementById('mName').innerText = selected.name;
            document.getElementById('mPrice').innerText = "₹" + selected.price;
            document.getElementById('mDesc').innerText = selected.desc;
            document.getElementById('pModal').style.display = 'block';
        }

        function openCheckout() {
            document.getElementById('cItem').innerText = selected.name;
            document.getElementById('cPrice').innerText = "₹" + selected.price;
            document.getElementById('checkoutModal').style.display = 'block';
        }

        function closeM(id) { document.getElementById(id).style.display = 'none'; }

        function finalOrder() {
            const n = document.getElementById('name').value;
            const a = document.getElementById('addr').value;
            const p = document.getElementById('pin').value;

            if(!n || !a || !p) { alert("Please fill all details!"); return; }

            const msg = `*NEW ORDER - BHARAT MART*%0A` +
                        `*Item:* ${selected.name}%0A` +
                        `*Price:* ₹${selected.price}%0A%0A` +
                        `*Customer Name:* ${n}%0A` +
                        `*Address:* ${a}%0A` +
                        `*Pincode:* ${p}`;

            window.open(`https://wa.me/917348698707?text=${msg}`);
            location.reload(); 
        }

        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage: 'hi'}, 'google_translate_element');
        }

        window.onload = () => render(products);
    </script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
