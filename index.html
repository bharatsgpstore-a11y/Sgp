<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bharat Mall | Fixed Version</title>
    <style>
        /* Pehle wala CSS yahan rahega (Shortening for focus) */
        :root { --p-blue: #2874f0; --orange: #fb641b; --bg: #f1f3f6; }
        body { margin: 0; font-family: sans-serif; background: var(--bg); pb: 60px; }
        header { background: var(--p-blue); color: white; padding: 15px; position: sticky; top:0; z-index: 100; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        .card { background: white; padding: 10px; border-radius: 5px; cursor: pointer; }
        .screen { position: fixed; inset: 0; background: white; z-index: 1000; display: none; overflow-y: auto; }
        .active { display: block !important; }
        .btn-buy { background: var(--orange); color: white; border: none; width: 100%; padding: 15px; font-weight: bold; cursor: pointer; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 10px; border-top: 1px solid #ddd; }
    </style>
</head>
<body>

<header>
    <div style="display:flex; justify-content:space-between">
        <b onclick="alert('Menu Open')">☰ Bharat Mall</b>
        <span onclick="openScreen('cartScr')">🛒 <span id="cartBadge">0</span></span>
    </div>
</header>

<div class="grid" id="productGrid">
    </div>

<div id="detailScr" class="screen">
    <div style="padding:15px; border-bottom:1px solid #ddd">
        <span style="font-size:24px" onclick="closeScreen('detailScr')">← Back</span>
    </div>
    <div id="detailBody" style="padding:20px"></div>
    <div style="position:fixed; bottom:0; width:100%; display:flex">
        <button style="flex:1; padding:20px; border:none; background:#fff" onclick="addToCart()">ADD TO CART</button>
        <button style="flex:1; padding:20px; border:none; background:#ff9f00; color:white" onclick="openScreen('checkoutScr')">BUY NOW</button>
    </div>
</div>

<div id="cartScr" class="screen">
    <div style="padding:15px; background:var(--p-blue); color:white">
        <span onclick="closeScreen('cartScr')">← My Cart</span>
    </div>
    <div id="cartItems" style="padding:15px"></div>
    <button class="btn-buy" id="checkoutBtn" style="position:fixed; bottom:0; display:none" onclick="openScreen('checkoutScr')">PLACE ORDER</button>
</div>

<div id="checkoutScr" class="screen">
    <div style="padding:15px">
        <span onclick="closeScreen('checkoutScr')">← Checkout</span>
        <h2>Delivery Address</h2>
        <input type="text" id="name" placeholder="Full Name" style="width:100%; padding:10px; margin:10px 0;">
        <input type="tel" id="phone" placeholder="Mobile Number" style="width:100%; padding:10px; margin:10px 0;">
        <button class="btn-buy" onclick="placeOrder()">CONFIRM ORDER</button>
    </div>
</div>

<script>
    // 1. DATA (Make sure IDs are numbers)
    const products = [
        { id: 101, name: "Redmi Note 15 SE", price: 19999, img: "https://via.placeholder.com/150" },
        { id: 102, name: "Samsung M14 5G", price: 12490, img: "https://via.placeholder.com/150" }
    ];

    let cart = [];
    let selectedProduct = null;

    // 2. RENDER PRODUCTS
    function init() {
        const grid = document.getElementById('productGrid');
        grid.innerHTML = products.map(p => `
            <div class="card" onclick="showProduct(${p.id})">
                <img src="${p.img}" width="100%">
                <h4>${p.name}</h4>
                <p>₹${p.price}</p>
            </div>
        `).join('');
    }

    // 3. NAVIGATION (Fixed IDs)
    function openScreen(id) {
        console.log("Opening Screen:", id);
        document.getElementById(id).classList.add('active');
        if(id === 'cartScr') renderCart();
    }

    function closeScreen(id) {
        document.getElementById(id).classList.remove('active');
    }

    // 4. PRODUCT DETAIL
    function showProduct(id) {
        selectedProduct = products.find(p => p.id === id);
        document.getElementById('detailBody').innerHTML = `
            <img src="${selectedProduct.img}" width="100%">
            <h2>${selectedProduct.name}</h2>
            <h1 style="color:green">₹${selectedProduct.price}</h1>
            <p>1 Year Warranty | 7 Days Replacement</p>
        `;
        openScreen('detailScr');
    }

    // 5. CART LOGIC
    function addToCart() {
        if(selectedProduct) {
            cart.push(selectedProduct);
            document.getElementById('cartBadge').innerText = cart.length;
            alert("Added to cart!");
            closeScreen('detailScr');
        }
    }

    function renderCart() {
        const container = document.getElementById('cartItems');
        const btn = document.getElementById('checkoutBtn');
        if(cart.length === 0) {
            container.innerHTML = "Your cart is empty!";
            btn.style.display = 'none';
        } else {
            container.innerHTML = cart.map(i => `
                <div style="display:flex; gap:10px; border-bottom:1px solid #eee; padding:10px">
                    <img src="${i.img}" width="50">
                    <div><b>${i.name}</b><br>₹${i.price}</div>
                </div>
            `).join('');
            btn.style.display = 'block';
        }
    }

    function placeOrder() {
        const n = document.getElementById('name').value;
        if(!n) return alert("Pata bhariye!");
        alert("Order Placed for " + n);
        cart = [];
        document.getElementById('cartBadge').innerText = "0";
        location.reload(); // Refresh to home
    }

    init();
</script>
</body>
</html>
