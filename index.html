  <!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bharat Mart | Best Online Shopping</title>
    <style>
        /* --- Colors & Styles --- */
        :root {
            --primary-blue: #004aad;
            --whatsapp-green: #25D366;
            --bg-color: #f4f7f9;
        }

        body { font-family: 'Poppins', sans-serif; margin: 0; background: var(--bg-color); }

        /* --- Header --- */
        header { background: var(--primary-blue); padding: 15px 5%; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .nav-container { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: auto; flex-wrap: wrap; }
        .logo { display: flex; align-items: center; text-decoration: none; color: white; }
        .logo img { height: 50px; margin-right: 10px; border-radius: 5px; }
        .search-box { flex-grow: 1; margin: 0 20px; display: flex; }
        .search-box input { width: 100%; padding: 10px; border: none; border-radius: 5px 0 0 5px; outline: none; }
        .search-box button { background: #ff9f00; border: none; padding: 10px 15px; color: white; cursor: pointer; border-radius: 0 5px 5px 0; font-weight: bold; }

        /* --- Categories --- */
        .cats { background: white; padding: 10px; display: flex; justify-content: center; gap: 20px; overflow-x: auto; white-space: nowrap; border-bottom: 1px solid #ddd; }
        .cat-link { text-decoration: none; color: #333; font-size: 14px; font-weight: 500; }

        /* --- Product Section --- */
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }

        /* --- Image Slider Inside Card --- */
        .product-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05); transition: 0.3s; }
        .product-card:hover { transform: translateY(-5px); }
        .slider { position: relative; width: 100%; height: 250px; }
        .slides { display: none; width: 100%; height: 100%; object-fit: cover; }
        .active-slide { display: block; }
        .slide-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.3); color: white; border: none; padding: 10px; cursor: pointer; font-size: 20px; }
        .next { right: 0; }
        .prev { left: 0; }

        /* --- Details --- */
        .details { padding: 20px; text-align: center; }
        .p-name { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        .p-price { color: #d32f2f; font-size: 20px; font-weight: bold; margin-bottom: 10px; }
        .rating { color: #ff9f00; margin-bottom: 15px; }

        .order-btn { display: flex; align-items: center; justify-content: center; background: var(--whatsapp-green); color: white; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: bold; gap: 10px; }
        .order-btn:hover { background: #1eb954; }

        footer { background: #333; color: white; text-align: center; padding: 20px; margin-top: 50px; }
    </style>
</head>
<body>

<header>
    <div class="nav-container">
        <a href="#" class="logo">
            <img src="https://i.supaimg.com/9c514b60-d26f-438e-a1bd-d40d94621afc/24240f0b-de22-4ed1-af65-b9a7a612159b.png" alt="Bharat Mart">
            <h2>Bharat Mart</h2>
        </a>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search Mobile, Electronics, Fashion...">
            <button onclick="search()">Search</button>
        </div>
    </div>
</header>

<div class="cats">
    <a href="#" class="cat-link">Mobiles</a>
    <a href="#" class="cat-link">Electronics</a>
    <a href="#" class="cat-link">Fashion</a>
    <a href="#" class="cat-link">Toys</a>
    <a href="#" class="cat-link">Food</a>
    <a href="#" class="cat-link">Books</a>
</div>

<div class="container">
    <h2 style="margin-bottom: 20px; color: var(--primary-blue);">Welcome to Bharat Mart</h2>
    
    <div class="grid">
        
        <div class="product-card">
            <div class="slider" id="slider1">
                <img src="https://via.placeholder.com/300x250?text=Image+1" class="slides active-slide">
                <img src="https://via.placeholder.com/300x250?text=Image+2" class="slides">
                <img src="https://via.placeholder.com/300x250?text=Image+3" class="slides">
                <button class="slide-btn prev" onclick="moveSlide(-1, 'slider1')">&#10094;</button>
                <button class="slide-btn next" onclick="moveSlide(1, 'slider1')">&#10095;</button>
            </div>
            <div class="details">
                <div class="p-name">Premium Smartphone</div>
                <div class="rating">★★★★☆ (4.5)</div>
                <div class="p-price">₹15,999</div>
                <a href="https://wa.me/917348698707?text=Hi Bharat Mart, I want to order 'Premium Smartphone' (Price: ₹15,999)" target="_blank" class="order-btn">
                    Order via WhatsApp
                </a>
            </div>
        </div>

        <div class="product-card">
            <div class="slider" id="slider2">
                <img src="https://via.placeholder.com/300x250?text=Product+A" class="slides active-slide">
                <img src="https://via.placeholder.com/300x250?text=Product+B" class="slides">
                <img src="https://via.placeholder.com/300x250?text=Product+C" class="slides">
                <button class="slide-btn prev" onclick="moveSlide(-1, 'slider2')">&#10094;</button>
                <button class="slide-btn next" onclick="moveSlide(1, 'slider2')">&#10095;</button>
            </div>
            <div class="details">
                <div class="p-name">Modern Electronics</div>
                <div class="rating">★★★★★ (5.0)</div>
                <div class="p-price">₹2,499</div>
                <a href="https://wa.me/917348698707?text=Hi Bharat Mart, I want to order 'Modern Electronics' (Price: ₹2,499)" target="_blank" class="order-btn">
                    Order via WhatsApp
                </a>
            </div>
        </div>

    </div>
</div>

<footer>
    <p>&copy; 2026 Bharat Mart | WhatsApp: 7348698707</p>
    <p>Return | Help | About Us</p>
</footer>

<script>
    // Slider Logic
    function moveSlide(step, sliderId) {
        const slider = document.getElementById(sliderId);
        const slides = slider.getElementsByClassName('slides');
        let currentIdx = 0;

        for (let i = 0; i < slides.length; i++) {
            if (slides[i].classList.contains('active-slide')) {
                currentIdx = i;
                slides[i].classList.remove('active-slide');
                break;
            }
        }

        let newIdx = currentIdx + step;
        if (newIdx >= slides.length) newIdx = 0;
        if (newIdx < 0) newIdx = slides.length - 1;

        slides[newIdx].classList.add('active-slide');
    }

    // Search Simulation
    function search() {
        let val = document.getElementById('searchInput').value.toLowerCase();
        alert("Searching for: " + val + "\n(This feature works with a database/Google Sheet)");
    }
</script>

</body>
</html>
