<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BHARAT SGPstore - Online Order</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; padding-top: 70px; }
        .header { background: #1e3c72; color: white; padding: 1rem; position: fixed; width: 100%; top: 0; z-index: 1000; text-align: center; font-weight: bold; font-size: 1.4rem; }
        .cart-icon { position: fixed; top: 15px; right: 20px; color: white; cursor: pointer; z-index: 1001; }
        .cart-count { background: #ff4757; border-radius: 50%; padding: 2px 6px; font-size: 0.7rem; position: absolute; top: -10px; right: -10px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; padding: 15px; }
        .product-card { background: white; border-radius: 10px; padding: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .product-image { width: 100%; height: 120px; object-fit: cover; border-radius: 5px; }
        .product-title { font-size: 1rem; margin-top: 5px; height: 40px; overflow: hidden; }
        .product-price { color: #1e3c72; font-weight: bold; margin: 5px 0; }
        .add-btn { background: #1e3c72; color: white; border: none; padding: 8px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; }
        
        /* Modal and Form Styles */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; overflow-y: auto; }
        .modal-content { background: white; margin: 5% auto; width: 90%; max-width: 400px; padding: 20px; border-radius: 15px; }
        input, textarea { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 5px; font-size: 1rem; }
        .order-btn { background: #28a745; color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1.1rem; margin-top: 10px; }
        .cart-item-list { max-height: 150px; overflow-y: auto; margin-bottom: 10px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

    <div class="header">🛍️ BHARAT SGPstore</div>
    <div class="cart-icon" onclick="toggleModal()">
        <i class="fas fa-shopping-cart fa-lg"></i>
        <span class="cart-count" id="count">0</span>
    </div>

    <div class="products-grid" id="grid"></div>

    <div class="modal" id="orderModal">
        <div class="modal-content">
            <h3 style="color: #1e3c72;">🛒 Aapka Order List</h3>
            <div id="cartList" class="cart-item-list"></div>
            <p style="font-weight: bold; font-size: 1.3rem; margin-bottom: 15px;">Total Bill: ₹<span id="totalPrice">0</span></p>
            
            <h4 style="border-top: 1px solid #eee; padding-top: 10px;">Delivery Details:</h4>
            <input type="text" id="name" placeholder="Apna Poora Naam" required>
            <input type="tel" id="phone" placeholder="Mobile Number" required>
            <textarea id="address" placeholder="Address (Gali No, Mohalla, City)" rows="3" required></textarea>
            
            <button class="order-btn" id="submitBtn" onclick="sendOrder()">Confirm Order Karein</button>
            <button onclick="toggleModal()" style="width:100%; background:none; border:none; color:#666; margin-top:10px; cursor:pointer;">Wapas Jayein</button>
        </div>
    </div>

    <script>
        // Aap yahan apne 50+ products ki list add kar sakte hain
        const products = [
            { id: 1, name: "Plastic Bucket (Badi)", price: 150, img: "https://images.unsplash.com/photo-1584622650111-993a426fbf0a?w=400" },
            { id: 2, name: "Plastic Mug", price: 30, img: "https://images.unsplash.com/photo-1574944985070-8f3ebc6b79d2?w=400" },
            { id: 3, name: "Cleaning Brush", price: 60, img: "https://images.unsplash.com/photo-1584622781564-1d9876a13d00?w=400" },
            { id: 4, name: "Storage Box", price: 250, img: "https://images.unsplash.com/photo-1591195853828-11db59a44f6b?w=400" }
        ];

        let cart = [];

        function displayProducts() {
            document.getElementById('grid').innerHTML = products.map(p => `
                <div class="product-card">
                    <img src="${p.img}" class="product-image">
                    <h4 class="product-title">${p.name}</h4>
                    <p class="product-price">₹${p.price}</p>
                    <button class="add-btn" onclick="add(${p.id})">Add to Cart</button>
                </div>`).join('');
        }

        function add(id) {
            const p = products.find(x => x.id === id);
            cart.push(p);
            update();
        }

        function update() {
            document.getElementById('count').innerText = cart.length;
            const total = cart.reduce((s, i) => s + i.price, 0);
            document.getElementById('totalPrice').innerText = total;
            document.getElementById('cartList').innerHTML = cart.map(i => `
                <div style="display:flex; justify-content:space-between; padding:5px 0;">
                    <span>${i.name}</span>
                    <span>₹${i.price}</span>
                </div>`).join('');
        }

        function toggleModal() {
            const m = document.getElementById('orderModal');
            m.style.display = m.style.display === 'block' ? 'none' : 'block';
        }

        async function sendOrder() {
            const n = document.getElementById('name').value;
            const p = document.getElementById('phone').value;
            const a = document.getElementById('address').value;
            const t = document.getElementById('totalPrice').innerText;

            if(!n || !p || !a) return alert("Kripya Naam, Number aur Address bharein!");
            if(cart.length === 0) return alert("Aapka cart khali hai!");
            
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Order Bhej Rahe Hain...";
            btn.disabled = true;

            const formID = "xaqllvvp"; // Aapki Formspree ID

            try {
                const response = await fetch(`https://formspree.io/f/${formID}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        Shop: "BHARAT SGPstore",
                        Customer: n,
                        Phone: p,
                        Address: a,
                        OrderItems: cart.map(i => i.name).join(", "),
                        TotalAmount: "₹" + t
                    })
                });

                if(response.ok) {
                    alert("🎉 Order Successful!\nBHARAT SGPstore par shopping karne ke liye dhanyawad. Hum aapse jald sampark karenge.");
                    cart = [];
                    update();
                    toggleModal();
                    document.getElementById('name').value = '';
                    document.getElementById('phone').value = '';
                    document.getElementById('address').value = '';
                } else {
                    alert("Kuch error aaya, kripya dubara try karein.");
                }
            } catch (err) {
                alert("Network error! Check karein ki internet chal raha hai.");
            }
            
            btn.innerText = "Confirm Order Karein";
            btn.disabled = false;
        }

        displayProducts();
    </script>
</body>
</html>
