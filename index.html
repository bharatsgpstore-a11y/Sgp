    <!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bharat Mart | Flipkart Style</title>
    <style>
        :root { --primary: #2874f0; --accent: #ff9f00; --text-light: #878787; }
        body { font-family: 'Roboto', Arial, sans-serif; margin: 0; background: #f1f3f6; color: #212121; }
        
        /* Header */
        header { background: var(--primary); padding: 12px; position: sticky; top: 0; z-index: 1000; color: white; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .search-container { background: white; border-radius: 2px; padding: 8px; display: flex; align-items: center; }
        .search-container input { width: 100%; border: none; outline: none; font-size: 14px; }

        /* Categories */
        .cat-box { background: white; display: flex; overflow-x: auto; padding: 10px 0; border-bottom: 1px solid #ddd; }
        .cat-item { text-align: center; min-width: 80px; font-size: 12px; font-weight: 500; cursor: pointer; }
        .cat-item img { width: 40px; height: 40px; margin-bottom: 4px; }

        /* Product Grid */
        .container { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px; }
        .p-card { background: white; padding: 10px; border-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        .p-card img { width: 100%; height: 140px; object-fit: contain; cursor: pointer; }
        .p-name { font-size: 13px; height: 32px; overflow: hidden; margin: 8px 0; line-height: 1.3; }
        .price-row { margin-bottom: 10px; }
        .price { font-size: 16px; font-weight: bold; }
        .old-price { font-size: 12px; color: var(--text-light); text-decoration: line-through; margin-left: 4px; }

        .btn-group { display: flex; gap: 4px; }
        .order-btn, .cart-btn { flex: 1; border: none; padding: 8px 0; font-size: 12px; font-weight: bold; color: white; border-radius: 2px; cursor: pointer; }
        .order-btn { background: var(--accent); }
        .cart-btn { background: #ff6417; }

        /* Modals */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: flex-end; }
        .modal-content { background: white; width: 100%; border-radius: 12px 12px 0 0; max-height: 85vh; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .close-btn { float: right; font-size: 24px; cursor: pointer; color: #666; }

        /* Detail Styling */
        .detail-section { margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px; }
        .detail-title { font-weight: bold; font-size: 16px; margin-bottom: 10px; }
        .highlight-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #f9f9f9; font-size: 14px; }
        .highlight-label { color: var(--text-light); width: 40%; }
        .highlight-value { width: 55%; font-weight: 500; }

        /* Menu Modal Styling */
        .menu-modal { align-items: center; }
        .menu-content { width: 90%; max-width: 400px; border-radius: 8px; }
    </style>
</head>
<body>

<header>
    <div class="header-top">
        <div style="font-size: 18px; font-weight: bold;">Bharat Mart</div>
        <div style="display: flex; gap: 18px; align-items: center;">
            <div onclick="openCart()" style="position: relative; cursor: pointer;">
                🛒 <span id="cartCount" style="background: #ff1212; color: white; font-size: 10px; padding: 1px 4px; border-radius: 50%; position: absolute; top: -10px; right: -10px;">0</span>
            </div>
            <div style="font-size: 22px; cursor: pointer;" onclick="openMenu()">⋮</div>
        </div>
    </div>
    <div class="search-container">
        <input type="text" id="searchInput" onkeyup="searchFn()" placeholder="Mobiles, Fashion, Electronics...">
    </div>
</header>

<div class="cat-box">
    <div class="cat-item" onclick="filter('all')"><img src="https://cdn-icons-png.flaticon.com/512/1041/1041888.png"><span>Sabhi</span></div>
    <div class="cat-item" onclick="filter('Mobiles')"><img src="https://cdn-icons-png.flaticon.com/512/644/644458.png"><span>Mobiles</span></div>
    <div class="cat-item" onclick="filter('Fashion')"><img src="https://cdn-icons-png.flaticon.com/512/3050/3050239.png"><span>Fashion</span></div>
    <div class="cat-item" onclick="filter('Electronics')"><img src="https://cdn-icons-png.flaticon.com/512/3659/3659899.png"><span>Electronics</span></div>
</div>

<div class="container" id="productGrid"></div>

<div id="detailsModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal('detailsModal')">&times;</span>
        <div id="detailsBody"></div>
    </div>
</div>

<div id="menuModal" class="modal menu-modal">
    <div class="modal-content menu-content">
        <span class="close-btn" onclick="closeModal('menuModal')">&times;</span>
        <h3 style="color: var(--primary);">Help & Requests</h3>
        <p style="font-size: 12px; color: #666;">Jo item nahi mil raha yahan btaiye:</p>
        <input type="text" id="reqItem" placeholder="Product ka naam...">
        <textarea id="complaint" rows="3" style="width:100%; margin-top:10px; padding:10px;" placeholder="Shikayat ya Feedback..."></textarea>
        <button class="order-btn" style="width:100%; margin-top:15px; padding:12px;" onclick="sendServiceReq()">Submit to Bharat Mart</button>
    </div>
</div>

<script>
    const sheetDB_URL = 'https://sheetdb.io/api/v1/wk3op4cmzg9hu';

    // Advanced Product Data for Details List
    const products = [
        { 
            name: "Realme Narzo N55 (6GB RAM, 128GB)", 
            cat: "Mobiles", price: 10999, old: 14999, 
            img: "https://m.media-amazon.com/images/I/41Sc4S9j-rL._SX300_SY300_QL70_FMwebp_.jpg",
            details: [
                {label: "Display", value: "6.72 inch Full HD+"},
                {label: "Camera", value: "64MP + 2MP | 8MP Front"},
                {label: "Processor", value: "MediaTek Helio G88"},
                {label: "Battery", value: "5000 mAh"}
            ]
        },
        { 
            name: "Sony Bravia 4K Ultra HD LED TV", 
            cat: "Electronics", price: 42990, old: 59990, 
            img: "https://m.media-amazon.com/images/I/71YvRreH+pL._SX450_.jpg",
            details: [
                {label: "Resolution", value: "Ultra HD (4K) 3840 x 2160"},
                {label: "Sound Output", value: "20 W"},
                {label: "Refresh Rate", value: "60 Hz"},
                {label: "Operating System", value: "Google TV"}
            ]
        },
        { 
            name: "Cotton Formal Slim Fit Shirt", 
            cat: "Fashion", price: 899, old: 1999, 
            img: "https://m.media-amazon.com/images/I/719f+47v3LL._AC_UL320_.jpg",
            details: [
                {label: "Fabric", value: "Pure Cotton"},
                {label: "Fit", value: "Slim Fit"},
                {label: "Sleeve", value: "Full Sleeve"},
                {label: "Pattern", value: "Solid Color"}
            ]
        }
    ];

    let cartCount = 0;

    function loadProducts(data) {
        const grid = document.getElementById('productGrid');
        grid.innerHTML = "";
        data.forEach((p, index) => {
            grid.innerHTML += `
                <div class="p-card">
                    <img src="${p.img}" onclick="showFullDetails(${index})">
                    <div class="p-name">${p.name}</div>
                    <div class="price-row">
                        <span class="price">₹${p.price.toLocaleString()}</span>
                        <span class="old-price">₹${p.old.toLocaleString()}</span>
                    </div>
                    <div class="btn-group">
                        <button class="order-btn" onclick="openOrder('${p.name}', ${p.price})">Order</button>
                        <button class="cart-btn" onclick="addToCart()">Add 🛒</button>
                    </div>
                </div>`;
        });
    }

    function showFullDetails(index) {
        const p = products[index];
        let detailHtml = `
            <img src="${p.img}" style="width:100%; height:250px; object-fit:contain; margin-bottom:15px;">
            <div style="font-size: 18px; font-weight: bold;">${p.name}</div>
            <div style="margin: 10px 0;">
                <span style="font-size: 22px; font-weight: bold;">₹${p.price.toLocaleString()}</span>
                <span style="color:#878787; text-decoration:line-through; margin-left:8px;">₹${p.old.toLocaleString()}</span>
                <span style="color:#388e3c; font-size:14px; font-weight:bold; margin-left:8px;">${Math.round((p.old-p.price)/p.old*100)}% off</span>
            </div>
            
            <div class="detail-section">
                <div class="detail-title">Product Highlights</div>`;
        
        p.details.forEach(d => {
            detailHtml += `
                <div class="highlight-item">
                    <div class="highlight-label">${d.label}</div>
                    <div class="highlight-value">${d.value}</div>
                </div>`;
        });

        detailHtml += `</div>
            <button class="order-btn" style="width:100%; padding:15px; margin-top:20px; font-size:16px;" 
                    onclick="openOrder('${p.name}', ${p.price})">Abhi Order Karein</button>`;
        
        document.getElementById('detailsBody').innerHTML = detailHtml;
        document.getElementById('detailsModal').style.display = 'flex';
    }

    function addToCart() {
        cartCount++;
        document.getElementById('cartCount').innerText = cartCount;
    }

    function openMenu() { document.getElementById('menuModal').style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    // ... (Old order logic and search logic will go here - same as before)
    window.onload = () => loadProducts(products);
</script>

</body>
</html>
