<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Bharat Mall | Online Shopping</title>
    <style>
        :root { --primary: #2874f0; --accent: #fb641b; --yellow: #ff9f00; --bg: #f1f3f6; }
        body { font-family: 'Segoe UI', Roboto, Arial, sans-serif; margin: 0; background: var(--bg); overflow-x: hidden; }

        /* 1. App Header & Search */
        header { background: var(--primary); color: white; padding: 10px; position: sticky; top: 0; z-index: 1000; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .logo { font-size: 20px; font-weight: bold; italic; }
        .search-box { background: white; border-radius: 2px; display: flex; padding: 2px 10px; }
        .search-box input { border: none; width: 100%; padding: 8px; outline: none; font-size: 14px; color: #333; }

        /* 4. Categories Section */
        .cat-container { background: white; display: flex; overflow-x: auto; padding: 10px; gap: 15px; border-bottom: 1px solid #ddd; scrollbar-width: none; }
        .cat-item { text-align: center; min-width: 65px; flex-shrink: 0; cursor: pointer; }
        .cat-item img { width: 45px; height: 45px; border-radius: 50%; background: #f0f0f0; margin-bottom: 4px; }
        .cat-item span { font-size: 11px; font-weight: 500; display: block; color: #333; }

        /* 6. Product Grid */
        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px; }
        .p-card { background: white; padding: 10px; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); position: relative; }
        .p-card img { width: 100%; height: 140px; object-fit: contain; }
        .p-title { font-size: 13px; font-weight: 500; height: 34px; overflow: hidden; margin: 8px 0; }
        .p-price { font-size: 16px; font-weight: bold; }
        .p-old { color: #878787; text-decoration: line-through; font-size: 12px; margin-left: 5px; }

        /* Multi-Screen / Modals */
        .page { display: none; position: fixed; inset: 0; background: white; z-index: 2000; overflow-y: auto; padding-bottom: 80px; }
        .active-page { display: block; }
        .page-header { background: var(--primary); color: white; padding: 15px; display: flex; align-items: center; gap: 15px; font-weight: bold; position: sticky; top: 0; z-index: 2001; }
        
        /* Product Details Slider */
        .slider { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; background: #fff; height: 300px; }
        .slider img { width: 100%; height: 300px; object-fit: contain; flex-shrink: 0; scroll-snap-align: center; }

        /* 8, 9, 10. Form & Payment Styling */
        .content-box { padding: 15px; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; }
        .input-group input, .input-group textarea, .input-group select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        
        .footer-btns { position: fixed; bottom: 0; left: 0; width: 100%; display: flex; border-top: 1px solid #ddd; z-index: 3000; }
        .btn-half { flex: 1; padding: 18px; text-align: center; font-weight: bold; font-size: 15px; cursor: pointer; border: none; }
        .btn-orange { background: var(--accent); color: white; }
        .btn-yellow { background: var(--yellow); color: white; }
        .btn-full { width: 100%; background: var(--accent); color: white; padding: 18px; border: none; font-weight: bold; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

<div id="homeScreen">
    <header>
        <div class="header-top">
            <div class="logo">Bharat Mall</div>
            <div style="cursor:pointer" onclick="alert('Login required!')">Login</div>
        </div>
        <div class="search-box">
            <input type="text" id="mainSearch" placeholder="Search for Products, Brands and More" oninput="doSearch()">
        </div>
    </header>

    <div class="cat-container">
        <div class="cat-item" onclick="filterCat('all')"><img src="https://cdn-icons-png.flaticon.com/512/1041/1041888.png"><span>All</span></div>
        <div class="cat-item" onclick="filterCat('Mobiles')"><img src="https://cdn-icons-png.flaticon.com/512/644/644458.png"><span>Mobiles</span></div>
        <div class="cat-item" onclick="filterCat('Fashion')"><img src="https://cdn-icons-png.flaticon.com/512/3050/3050239.png"><span>Fashion</span></div>
        <div class="cat-item" onclick="filterCat('Electronics')"><img src="https://cdn-icons-png.flaticon.com/512/3659/3659899.png"><span>Electronics</span></div>
        <div class="cat-item" onclick="filterCat('Home')"><img src="https://cdn-icons-png.flaticon.com/512/619/619153.png"><span>Home</span></div>
    </div>

    <div class="product-grid" id="mainGrid"></div>
</div>

<div id="detailsPage" class="page">
    <div class="page-header"><span onclick="closePage('detailsPage')">←</span> Bharat Mall Item</div>
    <div id="detailsContent"></div>
    <div class="footer-btns">
        <button class="btn-half btn-yellow" onclick="alert('Added to Cart!')">ADD TO CART</button>
        <button class="btn-half btn-orange" onclick="openPage('addressPage')">BUY NOW</button>
    </div>
</div>

<div id="addressPage" class="page">
    <div class="page-header"><span onclick="closePage('addressPage')">←</span> Delivery Address</div>
    <div class="content-box">
        <div class="input-group"><input type="text" id="custName" placeholder="Full Name (Required)"></div>
        <div class="input-group"><input type="tel" id="custPhone" placeholder="10-digit Mobile Number"></div>
        <div class="input-group"><input type="text" id="custPin" placeholder="Pincode"></div>
        <div class="input-group"><input type="text" id="custHouse" placeholder="House No., Building Name"></div>
        <div class="input-group"><textarea id="custArea" rows="3" placeholder="Road Name, Area, Colony"></textarea></div>
        <button class="btn-full" onclick="saveAddress()">SAVE AND CONTINUE</button>
    </div>
</div>

<div id="paymentPage" class="page">
    <div class="page-header"><span onclick="closePage('paymentPage')">←</span> Payments</div>
    <div class="content-box">
        <div class="input-group">
            <p>Select Payment Mode:</p>
            <select id="payMode">
                <option value="COD">Cash on Delivery</option>
                <option value="UPI">UPI (GPay / PhonePe)</option>
                <option value="Card">Debit / Credit Card</option>
            </select>
        </div>
        <div style="background:#fff; border:1px solid #ddd; padding:10px; margin-top:20px;">
            <p><b>Order Summary</b></p>
            <div id="finalSummary"></div>
        </div>
        <button class="btn-full" style="margin-top:20px;" onclick="placeOrder()">PLACE ORDER</button>
    </div>
</div>

<script>
    // Mega Data: 20 Items
    const products = [
        { id: 1, name: "Realme Narzo N55 (Prime Blue)", cat: "Mobiles", price: 10999, old: 14999, imgs: ["https://m.media-amazon.com/images/I/41Sc4S9j-rL._SX300_SY300_QL70_FMwebp_.jpg","https://m.media-amazon.com/images/I/81ogvU1j6SL._SL1500_.jpg","https://m.media-amazon.com/images/I/718ReZ9P80L._SL1500_.jpg","https://m.media-amazon.com/images/I/71X8X4eRzOL._SL1500_.jpg"] },
        { id: 2, name: "Samsung Galaxy M14 5G", cat: "Mobiles", price: 12490, old: 18990, imgs: ["https://m.media-amazon.com/images/I/817WWpaGyVL._SL1500_.jpg","https://m.media-amazon.com/images/I/81+GFF9V6JL._SL1500_.jpg","https://m.media-amazon.com/images/I/81SUEp6KHSL._SL1500_.jpg","https://m.media-amazon.com/images/I/817WWpaGyVL._SL1500_.jpg"] },
        { id: 3, name: "Men's Slim Fit Casual Shirt", cat: "Fashion", price: 699, old: 1299, imgs: ["https://m.media-amazon.com/images/I/719f+47v3LL._AC_UL320_.jpg","https://m.media-amazon.com/images/I/719f+47v3LL._AC_UL320_.jpg","https://m.media-amazon.com/images/I/719f+47v3LL._AC_UL320_.jpg","https://m.media-amazon.com/images/I/719f+47v3LL._AC_UL320_.jpg"] }
    ];

    // Dummy looping to ensure 20 products
    for(let i=4; i<=20; i++) {
        products.push({...products[i%3], id: i, name: products[i%3].name + " " + i});
    }

    let selectedItem = null;

    // Load Grid
    function renderGrid(list) {
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = list.map(p => `
            <div class="p-card" onclick="showProduct(${p.id})">
                <img src="${p.imgs[0]}">
                <div class="p-title">${p.name}</div>
                <div class="p-price">₹${p.price.toLocaleString()} <span class="p-old">₹${p.old}</span></div>
            </div>
        `).join('');
    }

    // 6. Product Selection
    function showProduct(id) {
        selectedItem = products.find(x => x.id == id);
        let sliderHtml = selectedItem.imgs.map(img => `<img src="${img}">`).join('');
        document.getElementById('detailsContent').innerHTML = `
            <div class="slider">${sliderHtml}</div>
            <div class="content-box">
                <h2 style="font-size:18px; margin:0">${selectedItem.name}</h2>
                <div style="font-size:22px; font-weight:bold; color:green; margin:10px 0;">₹${selectedItem.price.toLocaleString()}</div>
                <p style="font-size:14px; color:#555;">Delivery by Tomorrow | 7 Days Replacement Policy</p>
                <hr style="border:0; border-top:1px solid #ddd;">
                <p><b>Product Details</b></p>
                <p style="font-size:13px; color:#666;">Ye Bharat Mall ka premium product hai. Isme aapko milti hai behtareen quality aur durability.</p>
            </div>
        `;
        openPage('detailsPage');
    }

    // Helper functions for Navigation
    function openPage(id) { document.getElementById(id).classList.add('active-page'); }
    function closePage(id) { document.getElementById(id).classList.remove('active-page'); }

    // 8. Save Address Logic
    function saveAddress() {
        const n = document.getElementById('custName').value;
        const p = document.getElementById('custPhone').value;
        if(!n || p.length < 10) return alert("Please enter valid name and 10-digit phone!");
        
        document.getElementById('finalSummary').innerHTML = `
            <p>Item: ${selectedItem.name}</p>
            <p>Total: ₹${selectedItem.price.toLocaleString()}</p>
            <p>Deliver to: ${n}, ${p}</p>
        `;
        openPage('paymentPage');
    }

    // 11. Final Order Place
    function placeOrder() {
        const pay = document.getElementById('payMode').value;
        const n = document.getElementById('custName').value;
        const p = document.getElementById('custPhone').value;
        const a = document.getElementById('custArea').value;

        const orderData = { "data": [{
            "Timestamp": new Date().toLocaleString(),
            "Item": selectedItem.name,
            "Price": selectedItem.price,
            "Customer": n,
            "Contact": p,
            "Address": a,
            "PaymentMode": pay
        }]};

        // Order API (SheetDB)
        fetch('https://sheetdb.io/api/v1/wk3op4cmzg9hu', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(orderData)
        }).then(() => {
            alert("🎉 Bharat Mall: Order Success!\nTracking link aapke mobile par bhej diya jayega.");
            location.reload();
        }).catch(() => alert("Network Error!"));
    }

    // 5. Search & 4. Filter
    function doSearch() {
        let v = document.getElementById('mainSearch').value.toLowerCase();
        renderGrid(products.filter(p => p.name.toLowerCase().includes(v)));
    }

    function filterCat(cat) {
        renderGrid(cat === 'all' ? products : products.filter(p => p.cat === cat));
    }

    window.onload = () => renderGrid(products);
</script>
</body>
</html>
