<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bharat Mart - Online Shopping</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Roboto, Arial, sans-serif; }
        body { background-color: #f1f3f6; }

        /* Flipkart Blue Header */
        .header { background: #2874f0; color: white; padding: 10px 0; position: fixed; width: 100%; top: 0; z-index: 1000; }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; }
        
        .logo { font-size: 1.4rem; font-weight: bold; font-style: italic; display: flex; flex-direction: column; line-height: 1; }
        .logo span { font-size: 0.7rem; color: #ffe500; }

        .search-container { background: white; flex-grow: 1; margin: 0 20px; display: flex; border-radius: 2px; height: 36px; align-items: center; padding: 0 10px; }
        .search-container input { border: none; width: 100%; outline: none; padding: 5px; font-size: 0.9rem; }
        .search-container i { color: #2874f0; }

        .cart-btn { cursor: pointer; position: relative; font-weight: bold; }
        .cart-count { background: #ff6161; border-radius: 50%; padding: 2px 6px; font-size: 0.7rem; position: absolute; top: -12px; right: -12px; border: 1px solid white; }

        /* Product Grid */
        .main-content { margin-top: 70px; padding: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
        .product-card { background: white; padding: 10px; text-align: center; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); cursor: pointer; }
        .product-card img { width: 100%; height: 150px; object-fit: contain; }
        .p-name { font-size: 0.9rem; margin-top: 10px; color: #212121; height: 35px; overflow: hidden; }
        .p-price { font-weight: bold; font-size: 1.1rem; margin: 5px 0; color: #212121; }
        .p-offer { color: #388e3c; font-size: 0.8rem; font-weight: bold; }

        /* Modal / Interface */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 2000; overflow-y: auto; }
        .modal-body { padding: 20px; max-width: 500px; margin: 0 auto; text-align: center; }
        .buy-now-btn { background: #ff9f00; color: white; border: none; padding: 15px; width: 100%; font-weight: bold; border-radius: 2px; margin-top: 10px; font-size: 1rem; cursor: pointer; }
        .add-cart-btn { background: #fb641b; color: white; border: none; padding: 15px; width: 100%; font-weight: bold; border-radius: 2px; margin-top: 10px; font-size: 1rem; cursor: pointer; }

        input.details { width: 100%; padding: 12px; margin: 5px 0; border: 1px solid #ccc; border-radius: 2px; }
    </style>
</head>
<body>

    <header class="header">
        <div class="nav-container">
            <div class="logo">Bharat Mart <span>Plus <i class="fas fa-plus"></i></span></div>
            <div class="search-container">
                <input type="text" placeholder="Search for products, brands and more">
                <i class="fas fa-search"></i>
            </div>
            <div class="cart-btn" onclick="openCart()">
                <i class="fas fa-shopping-cart"></i> Cart
                <span class="cart-count" id="count">0</span>
            </div>
        </div>
    </header>

    <div class="main-content">
        <div class="grid" id="productGrid"></div>
    </div>

    <div class="modal" id="pModal">
        <div class="modal-body">
            <i class="fas fa-arrow-left" style="float: left; font-size: 1.2rem;" onclick="closeModal()"></i>
            <br>
            <img id="mImg" src="" style="width: 100%; height: 300px; object-fit: contain;">
            <h2 id="mName"></h2>
            <p class="p-offer">Special Price</p>
            <h1 id="mPrice" style="margin: 10px 0;"></h1>
            
            <div id="orderForm" style="display: none; text-align: left; background: #f9f9f9; padding: 15px; margin-top: 10px;">
                <h4>Delivery Details:</h4>
                <input type="text" id="custName" class="details" placeholder="Full Name">
                <input type="tel" id="custPhone" class="details" placeholder="Mobile Number">
                <textarea id="custAddr" class="details" placeholder="Full Address with Landmark" rows="3"></textarea>
                <button class="add-cart-btn" onclick="finalOrder()">Confirm Order (WhatsApp + Email)</button>
            </div>

            <div id="mainBtns">
                <button class="add-cart-btn" id="addBtn">ADD TO CART</button>
                <button class="buy-now-btn" onclick="showForm()">BUY NOW</button>
            </div>
            <button onclick="closeModal()" style="margin-top: 20px; border: none; background: none; color: #2874f0;">Back to Home</button>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, name: "Premium Plastic Bucket (20L)", price: 199, offer: "40% off", img: "https://images.unsplash.com/photo-1584622650111-993a426fbf0a?w=400" },
            { id: 2, name: "Durable Garden Rake (Iron)", price: 250, offer: "15% off", img: "https://images.unsplash.com/photo-1589923188900-85dae523342b?w=400" },
            { id: 3, name: "Kitchen Storage Box Set", price: 499, offer: "20% off", img: "https://images.unsplash.com/photo-1591195853828-11db59a44f6b?w=400" },
            { id: 4, name: "Plastic Chair - Set of 2", price: 1200, offer: "10% off", img: "https://images.unsplash.com/photo-1562113530-57ba4676e0c3?w=400" }
        ];

        let cart = [];
        let currentP = null;

        function render() {
            document.getElementById('productGrid').innerHTML = products.map(p => `
                <div class="product-card" onclick="viewP(${p.id})">
                    <img src="${p.img}">
                    <p class="p-name">${p.name}</p>
                    <p class="p-price">₹${p.price}</p>
                    <p class="p-offer">${p.offer}</p>
                </div>
            `).join('');
        }

        function viewP(id) {
            currentP = products.find(x => x.id === id);
            document.getElementById('mImg').src = currentP.img;
            document.getElementById('mName').innerText = currentP.name;
            document.getElementById('mPrice').innerText = "₹" + currentP.price;
            document.getElementById('pModal').style.display = 'block';
            document.getElementById('orderForm').style.display = 'none';
            document.getElementById('mainBtns').style.display = 'block';
            
            document.getElementById('addBtn').onclick = () => {
                cart.push(currentP);
                document.getElementById('count').innerText = cart.length;
                alert("Cart mein add ho gaya!");
                closeModal();
            };
        }

        function showForm() {
            document.getElementById('orderForm').style.display = 'block';
            document.getElementById('mainBtns').style.display = 'none';
        }

        function closeModal() { document.getElementById('pModal').style.display = 'none'; }

        async function finalOrder() {
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const addr = document.getElementById('custAddr').value;

            if(!name || !phone || !addr) return alert("Details bhariye!");

            const msg = `*Naya Order - Bharat Mart*%0A*Item:* ${currentP.name}%0A*Price:* ₹${currentP.price}%0A*Customer:* ${name}%0A*Address:* ${addr}`;
            
            // Email (Formspree)
            await fetch('https://formspree.io/f/xaqllvvp', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({Shop: "Bharat Mart", Customer: name, Phone: phone, Item: currentP.name, Total: currentP.price})
            });

            // WhatsApp Redirect
            window.open(`https://wa.me/917348698707?text=${msg}`, '_blank');
            closeModal();
        }

        render();
    </script>
</body>
</html>
