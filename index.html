<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bharat Mart | Your Store</title>
    <style>
        :root { --primary: #004aad; --accent: #ff9f00; --cart: #2874f0; --white: #fff; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f1f3f6; color: #333; padding-bottom: 50px; }
        
        /* Header */
        header { background: var(--primary); padding: 12px; position: sticky; top: 0; z-index: 1000; }
        .logo-row { display: flex; justify-content: space-between; align-items: center; color: white; margin-bottom: 10px; }
        .plus-tag { background: #ffeb3b; color: #000; font-size: 10px; padding: 2px 6px; border-radius: 10px; font-weight: bold; }
        
        .search-container { background: white; display: flex; border-radius: 4px; padding: 2px 10px; align-items: center; }
        .search-container input { width: 100%; border: none; padding: 10px; outline: none; }

        /* Categories */
        .cat-box { background: white; display: flex; overflow-x: auto; padding: 15px 5px; gap: 15px; border-bottom: 1px solid #ddd; }
        .cat-item { text-align: center; min-width: 70px; cursor: pointer; }
        .cat-item img { width: 45px; height: 45px; margin-bottom: 5px; }
        .cat-item span { font-size: 12px; font-weight: 500; display: block; }

        /* Product Grid */
        .container { padding: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .p-card { background: white; border-radius: 4px; padding: 10px; text-align: center; position: relative; }
        .p-card img { width: 100%; height: 130px; object-fit: contain; cursor: pointer; }
        .p-name { font-size: 13px; height: 35px; overflow: hidden; margin: 8px 0; font-weight: 500; }
        .p-rating { color: #388e3c; background: #e8f5e9; font-size: 11px; padding: 2px 5px; border-radius: 3px; display: inline-block; margin-bottom: 5px; }
        .price { font-size: 16px; font-weight: bold; color: #212121; }
        .old-price { font-size: 12px; color: #878787; text-decoration: line-through; }

        .btn-group { display: flex; gap: 5px; margin-top: 10px; }
        .order-btn { background: var(--accent); color: white; border: none; padding: 8px 0; border-radius: 2px; flex: 1; cursor: pointer; font-size: 12px; font-weight: bold; }
        .cart-btn { background: var(--cart); color: white; border: none; padding: 8px 0; border-radius: 2px; flex: 1; cursor: pointer; font-size: 12px; font-weight: bold; }

        /* Modals (Popups) */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; }
        .modal-content { background: white; width: 90%; max-width: 400px; padding: 20px; border-radius: 8px; position: relative; max-height: 80vh; overflow-y: auto; }
        .close { position: absolute; right: 15px; top: 10px; font-size: 24px; cursor: pointer; }

        /* Customer Service Section */
        .service-section { background: white; margin: 10px; padding: 15px; border-radius: 4px; }
        .service-section h3 { font-size: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-top: 0; }
        textarea, input[type="text"] { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .submit-btn { background: var(--primary); color: white; border: none; padding: 10px; width: 100%; border-radius: 4px; cursor: pointer; }

        .star-rating { color: #ccc; font-size: 25px; cursor: pointer; text-align: center; margin: 10px 0; }
        .star-rating .active { color: #ffbf00; }
    </style>
</head>
<body>

<header>
    <div class="logo-row">
        <div style="font-size: 20px; font-weight: bold;">Bharat Mart <span class="plus-tag">PLUS BLACK</span></div>
        <div id="cartCount" style="background: white; color: var(--primary); padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: bold;">🛒 0</div>
    </div>
    <div class="search-container">
        <input type="text" id="searchInput" onkeyup="searchFn()" placeholder="Mobiles, Fashion, Home dhoondein...">
        <span>🔍</span>
    </div>
</header>

<div class="cat-box">
    <div class="cat-item" onclick="filter('all')"><img src="https://cdn-icons-png.flaticon.com/512/1041/1041888.png"><span>Sabhi</span></div>
    <div class="cat-item" onclick="filter('Mobiles')"><img src="https://cdn-icons-png.flaticon.com/512/644/644458.png"><span>Mobiles</span></div>
    <div class="cat-item" onclick="filter('Fashion')"><img src="https://cdn-icons-png.flaticon.com/512/3050/3050239.png"><span>Fashion</span></div>
    <div class="cat-item" onclick="filter('Electronics')"><img src="https://cdn-icons-png.flaticon.com/512/3659/3659899.png"><span>TV</span></div>
    <div class="cat-item" onclick="filter('Home')"><img src="https://cdn-icons-png.flaticon.com/512/619/619153.png"><span>Home</span></div>
</div>

<div class="container" id="productGrid">
    </div>

<div class="service-section">
    <h3>Item Request & Complaint</h3>
    <p style="font-size: 12px; color: #666;">Jo product nahi mil raha yahan likhein, hum mangwa denge!</p>
    <input type="text" id="reqItem" placeholder="Product ka naam...">
    <textarea id="complaint" rows="3" placeholder="Apni shikayat ya feedback likhein..."></textarea>
    
    <div class="star-rating" id="ratingStars">
        <span onclick="setRating(1)">★</span><span onclick="setRating(2)">★</span><span onclick="setRating(3)">★</span><span onclick="setRating(4)">★</span><span onclick="setRating(5)">★</span>
    </div>
    
    <button class="submit-btn" onclick="sendServiceReq()">Submit to Bharat Mart</button>
</div>

<div id="detailsModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('detailsModal')">&times;</span>
        <div id="detailsBody"></div>
    </div>
</div>

<div id="orderModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('orderModal')">&times;</span>
        <h3 style="color: var(--primary);">Checkout</h3>
        <p id="orderItemTitle" style="font-weight: bold;"></p>
        <input type="text" id="custName" placeholder="Aapka Naam">
        <input type="tel" id="custPhone" placeholder="Mobile Number">
        <textarea id="custAddress" placeholder="Pura Pata (Delivery Address)"></textarea>
        <button class="submit-btn" style="background: #28a745;" onclick="finalOrder()">Confirm Order via WhatsApp</button>
    </div>
</div>

<script>
    // Product Database with Details
    const products = [
        { name: "Realme Narzo N55", cat: "Mobiles", price: 10999, old: 14999, img: "https://m.media-amazon.com/images/I/41Sc4S9j-rL._SX300_SY300_QL70_FMwebp_.jpg", desc: "6.7 inch Display, 64MP Camera, 5000mAh Battery, Fast Charging." },
        { name: "Cotton Casual Shirt", cat: "Fashion", price: 799, old: 1299, img: "https://m.media-amazon.com/images/I/719f+47v3LL._AC_UL320_.jpg", desc: "Pure Cotton, Slim Fit, All Sizes Available." },
        { name: "Smart LED TV 32 inch", cat: "Electronics", price: 12499, old: 18000, img: "https://m.media-amazon.com/images/I/71YvRreH+pL._SX450_.jpg", desc: "HD Ready, Android TV, 20W Sound, Multiple Ports." },
        { name: "Plastic Storage Bin", cat: "Home", price: 499, old: 899, img: "https://m.media-amazon.com/images/I/61NfXpM0HCL._SX450_.jpg", desc: "Strong Plastic, 20L Capacity, Blue Color." }
    ];

    let cartCount = 0;
    let selectedRating = 0;
    let currentItem = {};

    function loadProducts(data) {
        const grid = document.getElementById('productGrid');
        grid.innerHTML = "";
        data.forEach(p => {
            grid.innerHTML += `
                <div class="p-card">
                    <img src="${p.img}" onclick="showDetails('${p.name}')">
                    <div class="p-rating">4.2 ★</div>
                    <div class="p-name">${p.name}</div>
                    <div><span class="price">₹${p.price}</span> <span class="old-price">₹${p.old}</span></div>
                    <div class="btn-group">
                        <button class="order-btn" onclick="openOrder('${p.name}', ${p.price})">Order</button>
                        <button class="cart-btn" onclick="addToCart()">Add 🛒</button>
                    </div>
                </div>
            `;
        });
    }

    window.onload = () => loadProducts(products);

    function showDetails(name) {
        const p = products.find(x => x.name === name);
        document.getElementById('detailsBody').innerHTML = `
            <img src="${p.img}" style="width:100%; height:200px; object-fit:contain;">
            <h2>${p.name}</h2>
            <p><b>Category:</b> ${p.cat}</p>
            <p><b>Specifications:</b> ${p.desc}</p>
            <p style="color:red; font-size:20px;"><b>Price: ₹${p.price}</b></p>
            <button class="submit-btn" onclick="openOrder('${p.name}', ${p.price})">Abhi Order Karein</button>
        `;
        document.getElementById('detailsModal').style.display = 'flex';
    }

    function openOrder(name, price) {
        currentItem = { name, price };
        document.getElementById('orderItemTitle').innerText = name + " - ₹" + price;
        document.getElementById('orderModal').style.display = 'flex';
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function addToCart() {
        cartCount++;
        document.getElementById('cartCount').innerText = "🛒 " + cartCount;
        alert("Item Cart mein add ho gaya!");
    }

    function searchFn() {
        let val = document.getElementById('searchInput').value.toLowerCase();
        let filtered = products.filter(p => p.name.toLowerCase().includes(val));
        loadProducts(filtered);
    }

    function filter(cat) {
        let filtered = cat === 'all' ? products : products.filter(p => p.cat === cat);
        loadProducts(filtered);
    }

    function setRating(n) {
        selectedRating = n;
        let stars = document.getElementById('ratingStars').children;
        for(let i=0; i<5; i++) {
            stars[i].className = i < n ? "active" : "";
        }
    }

    function finalOrder() {
        const name = document.getElementById('custName').value;
        const phone = document.getElementById('custPhone').value;
        const addr = document.getElementById('custAddress').value;
        if(!name || !phone || !addr) return alert("Details bharein!");
        
        let msg = `*Bharat Mart Order*%0AProduct: ${currentItem.name}%0APrice: ${currentItem.price}%0AName: ${name}%0AAddr: ${addr}`;
        window.open(`https://wa.me/917348698707?text=${msg}`);
    }

    function sendServiceReq() {
        const req = document.getElementById('reqItem').value;
        const comp = document.getElementById('complaint').value;
        let msg = `*Bharat Mart Service*%0ARequest: ${req}%0AComplaint: ${comp}%0ARating: ${selectedRating} Star`;
        window.open(`https://wa.me/917348698707?text=${msg}`);
    }
</script>

</body>
</html>
