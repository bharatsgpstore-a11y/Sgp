<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bharat Mart | Mega Store</title>
    <style>
        :root { --primary: #2874f0; --accent: #ff9f00; --cart: #fb641b; --text-gray: #878787; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f1f3f6; }
        
        /* Header & Search */
        header { background: var(--primary); padding: 12px; position: sticky; top: 0; z-index: 1000; color: white; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .search-container { background: white; border-radius: 2px; padding: 5px 10px; display: flex; align-items: center; }
        .search-container input { width: 100%; border: none; padding: 8px; outline: none; }

        /* Categories Bar */
        .cat-box { background: white; display: flex; overflow-x: auto; padding: 12px 5px; gap: 15px; border-bottom: 1px solid #ddd; }
        .cat-item { text-align: center; min-width: 70px; cursor: pointer; }
        .cat-item img { width: 45px; height: 45px; margin-bottom: 5px; border-radius: 50%; }
        .cat-item span { font-size: 11px; font-weight: 500; display: block; }

        /* Product Grid */
        .container { padding: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .p-card { background: white; padding: 10px; border-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); text-align: left; }
        .p-card img { width: 100%; height: 130px; object-fit: contain; cursor: pointer; }
        .p-name { font-size: 13px; height: 34px; overflow: hidden; margin: 8px 0; font-weight: 500; }
        .price { font-size: 16px; font-weight: bold; }
        .old-price { font-size: 12px; color: var(--text-gray); text-decoration: line-through; margin-left: 5px; }

        /* Multi-Image Slider in Details */
        .slider { display: flex; overflow-x: auto; gap: 10px; scroll-snap-type: x mandatory; margin-bottom: 15px; }
        .slider img { width: 100%; height: 250px; object-fit: contain; scroll-snap-align: center; flex-shrink: 0; background: #fff; }

        /* Modals */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); align-items: flex-end; }
        .modal-content { background: white; width: 100%; border-radius: 15px 15px 0 0; padding: 20px; box-sizing: border-box; max-height: 90vh; overflow-y: auto; }
        .close { float: right; font-size: 30px; cursor: pointer; margin-top: -10px; }

        .section-title { font-weight: bold; border-bottom: 1px solid #eee; padding: 10px 0; margin-top: 15px; }
        .highlight-row { display: flex; padding: 8px 0; font-size: 14px; border-bottom: 1px solid #f9f9f9; }
        .h-label { color: var(--text-gray); width: 40%; }
        .h-value { width: 60%; font-weight: 500; }

        .btn-group { display: flex; gap: 5px; margin-top: 10px; }
        .buy-btn { background: var(--accent); color: white; border: none; padding: 10px; flex: 1; font-weight: bold; border-radius: 2px; }
        .cart-btn { background: var(--cart); color: white; border: none; padding: 10px; flex: 1; font-weight: bold; border-radius: 2px; }
        
        input, textarea { width: 100%; padding: 12px; margin-top: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .confirm-btn { background: #28a745; color: white; border: none; padding: 15px; width: 100%; margin-top: 15px; font-weight: bold; border-radius: 4px; }
    </style>
</head>
<body>

<header>
    <div class="header-top">
        <div style="font-size: 20px; font-weight: bold;">Bharat Mart</div>
        <div style="display: flex; align-items: center; gap: 15px;">
            <div onclick="openCart()" style="position: relative; cursor: pointer;">
                🛒 <span id="cartCount" style="background: red; color: white; font-size: 10px; padding: 1px 5px; border-radius: 50%; position: absolute; top: -10px; right: -10px;">0</span>
            </div>
            <div onclick="openMenu()" style="font-size: 24px; cursor: pointer;">⋮</div>
        </div>
    </div>
    <div class="search-container">
        <input type="text" id="searchInput" onkeyup="searchFn()" placeholder="Samaan dhoondein...">
    </div>
</header>

<div class="cat-box" id="catBar">
    <div class="cat-item" onclick="filter('all')"><img src="https://cdn-icons-png.flaticon.com/512/1041/1041888.png"><span>Sabhi</span></div>
    <div class="cat-item" onclick="filter('Mobiles')"><img src="https://cdn-icons-png.flaticon.com/512/644/644458.png"><span>Mobiles</span></div>
    <div class="cat-item" onclick="filter('Fashion')"><img src="https://cdn-icons-png.flaticon.com/512/3050/3050239.png"><span>Fashion</span></div>
    <div class="cat-item" onclick="filter('Electronics')"><img src="https://cdn-icons-png.flaticon.com/512/3659/3659899.png"><span>Electronics</span></div>
    <div class="cat-item" onclick="filter('Home')"><img src="https://cdn-icons-png.flaticon.com/512/619/619153.png"><span>Home</span></div>
</div>

<div class="container" id="productGrid"></div>

<div id="detailsModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('detailsModal')">&times;</span>
        <div id="detailsBody"></div>
    </div>
</div>

<div id="orderModal" class="modal">
    <div class="modal-content" style="border-radius: 10px; margin: 20px; width: auto;">
        <span class="close" onclick="closeModal('orderModal')">&times;</span>
        <h3>Delivery Details</h3>
        <p id="orderItemTitle" style="font-weight: bold; color: var(--primary);"></p>
        <input type="text" id="custName" placeholder="Aapka Naam">
        <input type="tel" id="custPhone" placeholder="Mobile Number">
        <textarea id="custAddress" placeholder="Pura Pata (Address)"></textarea>
        <button class="confirm-btn" onclick="finalOrderToSheet()">Order Confirm Karein</button>
    </div>
</div>

<script>
    const sheetDB_URL = 'https://sheetdb.io/api/v1/wk3op4cmzg9hu';

    // 20 Items Data Structure (Sample items included, duplicate to reach 20)
    const products = [
        { 
            name: "Realme Narzo N55 (6GB RAM)", cat: "Mobiles", price: 10999, old: 14999, 
            imgs: ["https://m.media-amazon.com/images/I/41Sc4S9j-rL._SX300_SY300_QL70_FMwebp_.jpg", "https://m.media-amazon.com/images/I/81ogvU1j6SL._SL1500_.jpg", "https://m.media-amazon.com/images/I/718ReZ9P80L._SL1500_.jpg", "https://m.media-amazon.com/images/I/71X8X4eRzOL._SL1500_.jpg"],
            desc: "Fast charging, great camera, and sleek design.",
            highlights: [{l:"RAM", v:"6GB"}, {l:"Battery", v:"5000mAh"}, {l:"Camera", v:"64MP"}, {l:"Display", v:"6.7 inch"}]
        },
        { 
            name: "Samsung Galaxy M14 5G", cat: "Mobiles", price: 12490, old: 17990, 
            imgs: ["https://m.media-amazon.com/images/I/817WWpaGyVL._SL1500_.jpg", "https://m.media-amazon.com/images/I/81+GFF9V6JL._SL1500_.jpg", "https://m.media-amazon.com/images/I/81ogvU1j6SL._SL1500_.jpg", "https://m.media-amazon.com/images/I/817WWpaGyVL._SL1500_.jpg"],
            desc: "5G speed with massive battery life.",
            highlights: [{l:"Network", v:"5G Ready"}, {l:"Battery", v:"6000mAh"}, {l:"Processor", v:"Exynos 1330"}]
        },
        { 
            name: "Men's Cotton Formal Shirt", cat: "Fashion", price: 699, old: 1299, 
            imgs: ["https://m.media-amazon.com/images/I/719f+47v3LL._AC_UL320_.jpg", "https://m.media-amazon.com/images/I/719f+47v3LL._AC_UL320_.jpg", "https://m.media-amazon.com/images/I/719f+47v3LL._AC_UL320_.jpg", "https://m.media-amazon.com/images/I/719f+47v3LL._AC_UL320_.jpg"],
            desc: "Premium quality cotton for office wear.",
            highlights: [{l:"Fabric", v:"100% Cotton"}, {l:"Fit", v:"Slim Fit"}]
        }
        // ... (Aap aise hi 20 items add kar sakte hain)
    ];

    // Dummy loop to show 20 items for testing
    for(let i=0; i<17; i++) { products.push({...products[0], name: products[0].name + " " + (i+2)}); }

    function loadProducts(data) {
        const grid = document.getElementById('productGrid');
        grid.innerHTML = "";
        data.forEach((p, index) => {
            grid.innerHTML += `
                <div class="p-card">
                    <img src="${p.imgs[0]}" onclick="showDetails(${index})">
                    <div class="p-name">${p.name}</div>
                    <div class="price">₹${p.price.toLocaleString()} <span class="old-price">₹${p.old.toLocaleString()}</span></div>
                    <div class="btn-group">
                        <button class="cart-btn" onclick="addToCart()">Add 🛒</button>
                        <button class="buy-btn" onclick="openOrder('${p.name}', ${p.price})">Buy</button>
                    </div>
                </div>`;
        });
    }

    function showDetails(idx) {
        const p = products[idx];
        let sliderHtml = p.imgs.map(img => `<img src="${img}">`).join("");
        let highlightsHtml = p.highlights.map(h => `<div class="highlight-row"><div class="h-label">${h.l}</div><div class="h-value">${h.v}</div></div>`).join("");

        document.getElementById('detailsBody').innerHTML = `
            <div class="slider">${sliderHtml}</div>
            <div style="font-size:18px; font-weight:bold;">${p.name}</div>
            <div style="font-size:22px; color:green; margin:10px 0;">₹${p.price.toLocaleString()}</div>
            <div class="section-title">Details</div>
            <p style="font-size:14px; color:#555;">${p.desc}</p>
            <div class="section-title">Highlights</div>
            ${highlightsHtml}
            <button class="confirm-btn" onclick="openOrder('${p.name}', ${p.price})">Abhi Kharidein</button>
        `;
        document.getElementById('detailsModal').style.display = 'flex';
    }

    // Logic for Order, Cart, Search (Same as before)
    let cartCount = 0;
    function addToCart() { cartCount++; document.getElementById('cartCount').innerText = cartCount; alert("Cart mein add ho gaya!"); }
    function openOrder(name, price) { 
        document.getElementById('orderItemTitle').innerText = name + " - ₹" + price;
        document.getElementById('orderModal').style.display = 'flex';
    }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    window.onload = () => loadProducts(products);
</script>
</body>
</html>
