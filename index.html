        <!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bharat Mart | Order Now</title>
    <style>
        :root { --primary: #004aad; --dark: #333; --white: #fff; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f4f4f4; }
        
        header { background: var(--primary); color: white; padding: 15px; text-align: center; position: sticky; top: 0; z-index: 100; }
        .logo img { height: 40px; vertical-align: middle; }

        /* --- Search Bar Styling --- */
        .search-area {
            background: white;
            padding: 15px;
            display: flex;
            justify-content: center;
            border-bottom: 1px solid #ddd;
        }
        .search-container {
            width: 90%;
            max-width: 500px;
            display: flex;
            border: 1px solid #ccc;
            border-radius: 25px;
            overflow: hidden;
        }
        .search-container input {
            width: 100%;
            padding: 10px 15px;
            border: none;
            outline: none;
        }
        .search-container button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 15px;
            cursor: pointer;
        }

        /* Product Grid */
        .container { max-width: 1200px; margin: 20px auto; padding: 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 10px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; }
        .buy-btn { background: #ff9f00; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }

        /* Order Modal (Popup) */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); }
        .modal-content { background: white; margin: 10% auto; padding: 25px; width: 90%; max-width: 450px; border-radius: 15px; position: relative; }
        .close { position: absolute; right: 20px; top: 15px; font-size: 24px; cursor: pointer; }
        
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .confirm-btn { background: #28a745; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <img src="https://i.supaimg.com/9c514b60-d26f-438e-a1bd-d40d94621afc/24240f0b-de22-4ed1-af65-b9a7a612159b.png">
        <span style="font-size: 22px; font-weight: bold; margin-left: 10px;">Bharat Mart</span>
    </div>
</header>

<div class="search-area">
    <div class="search-container">
        <input type="text" id="myInput" onkeyup="searchFn()" placeholder="Samaan dhoondein...">
        <button>🔍</button>
    </div>
</div>

<div class="container" id="productGrid">
    <div class="card">
        <img src="https://via.placeholder.com/300x200?text=Smartphone">
        <h3 class="p-name">Premium Smartphone</h3>
        <p style="color: #ff9f00;">★★★★☆ (4.2)</p>
        <p style="font-size: 20px; font-weight: bold;">₹14,999</p>
        <button class="buy-btn" onclick="openOrder('Premium Smartphone', '₹14,999')">Order Karein</button>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/300x200?text=Headphones">
        <h3 class="p-name">Wireless Headphones</h3>
        <p style="color: #ff9f00;">★★★★★ (5.0)</p>
        <p style="font-size: 20px; font-weight: bold;">₹1,999</p>
        <button class="buy-btn" onclick="openOrder('Wireless Headphones', '₹1,999')">Order Karein</button>
    </div>
</div>

<div id="orderModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeOrder()">&times;</span>
        <h2 style="color: var(--primary);">Checkout</h2>
        <hr><br>
        <p id="selectedItem" style="font-weight: bold;"></p>
        <br>
        <div class="form-group">
            <label>Aapka Naam:</label>
            <input type="text" id="custName" placeholder="Pura naam likhein">
        </div>
        <div class="form-group">
            <label>Mobile Number:</label>
            <input type="tel" id="custPhone" placeholder="10 digit number">
        </div>
        <div class="form-group">
            <label>Delivery Address:</label>
            <textarea id="custAddress" rows="3" placeholder="Pura pata likhein (City, Pincode ke sath)"></textarea>
        </div>
        <button class="confirm-btn" onclick="confirmOrder()">Order Confirm Karein</button>
    </div>
</div>

<script>
    let currentProduct = "";
    let currentPrice = "";

    // Search function added
    function searchFn() {
        let input = document.getElementById("myInput").value.toLowerCase();
        let cards = document.getElementsByClassName("card");

        for (let i = 0; i < cards.length; i++) {
            let name = cards[i].getElementsByClassName("p-name")[0].innerText.toLowerCase();
            if (name.includes(input)) {
                cards[i].style.display = "";
            } else {
                cards[i].style.display = "none";
            }
        }
    }

    function openOrder(name, price) {
        currentProduct = name;
        currentPrice = price;
        document.getElementById('selectedItem').innerText = "Product: " + name + " (" + price + ")";
        document.getElementById('orderModal').style.display = "block";
    }

    function closeOrder() {
        document.getElementById('orderModal').style.display = "none";
    }

    function confirmOrder() {
        let name = document.getElementById('custName').value;
        let phone = document.getElementById('custPhone').value;
        let address = document.getElementById('custAddress').value;

        if(name == "" || phone == "" || address == "") {
            alert("Kripya saari details bharein!");
            return;
        }

        let message = `*Naya Order - Bharat Mart*%0A` +
                      `--------------------------%0A` +
                      `*Product:* ${currentProduct}%0A` +
                      `*Price:* ${currentPrice}%0A%0A` +
                      `*Customer Details:*%0A` +
                      `Name: ${name}%0A` +
                      `Phone: ${phone}%0A` +
                      `Address: ${address}%0A` +
                      `--------------------------%0A` +
                      `Kripya jaldi deliver karein!`;

        window.open(`https://wa.me/917348698707?text=${message}`, '_blank');
        closeOrder();
    }
</script>

</body>
</html>
