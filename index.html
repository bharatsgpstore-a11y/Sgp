<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bharat Mart - SGP Store</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #f8f9fa; }

        /* Aesthetic Welcome Screen */
        #welcome-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #2874f0, #0049af);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 5000; color: white; transition: 0.8s ease-in-out;
        }
        .welcome-logo { width: 100px; animation: pulse 2s infinite; margin-bottom: 20px; border-radius: 50%; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        /* Language Selector Styling */
        #google_translate_element { padding: 10px; background: white; text-align: center; border-bottom: 1px solid #ddd; }

        /* Header */
        .header { background: #2874f0; color: white; padding: 12px 15px; position: sticky; top: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: center; }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-img { height: 35px; width: 35px; border-radius: 50%; background: white; }

        /* Main Content */
        .container { padding: 15px; margin-top: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
        .card { background: white; border-radius: 12px; padding: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; }
        .card img { width: 100%; height: 120px; object-fit: contain; }

        /* Return Policy Section */
        .policy-box { 
            background: #fff3cd; color: #856404; padding: 15px; margin: 20px 0; 
            border-radius: 8px; border-left: 5px solid #ffeeba; font-size: 0.9rem;
        }

        /* Modal / Details */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 3000; overflow-y: auto; }
        .modal-header { padding: 15px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 15px; }
        .btn-buy { background: #fb641b; color: white; border: none; padding: 15px; width: 100%; font-weight: bold; position: fixed; bottom: 0; font-size: 1.1rem; }
    </style>
</head>
<body>

    <div id="welcome-screen">
        <img src="https://i.supaimg.com/9c514b60-d26f-438e-a1bd-d40d94621afc/24240f0b-de22-4ed1-af65-b9a7a612159b.png" class="welcome-logo">
        <h1 style="letter-spacing: 2px;">BHARAT MART</h1>
        <p style="margin-top: 10px; font-weight: 300;">Quality & Trust Since 2023</p>
        <button onclick="startApp()" style="margin-top: 30px; padding: 10px 30px; border-radius: 25px; border: none; background: white; color: #2874f0; font-weight: bold; cursor: pointer;">Shop Now</button>
    </div>

    <div id="google_translate_element"></div>

    <header class="header">
        <div class="logo-area">
            <img src="https://i.supaimg.com/9c514b60-d26f-438e-a1bd-d40d94621afc/24240f0b-de22-4ed1-af65-b9a7a612159b.png" class="logo-img">
            <span style="font-weight: bold;">Bharat Mart</span>
        </div>
        <div class="icons">
            <i class="fas fa-shopping-cart"></i>
        </div>
    </header>

    <div class="container">
        <div class="policy-box">
            <i class="fas fa-undo-alt"></i> <strong>7-Day Easy Return:</strong> Agar product defected hai ya pasand nahi aaya, toh 7 dino ke andar return karein. 
            <a href="https://wa.me/917348698707" style="color: #856404; font-weight: bold;">Click for Return Request</a>
        </div>

        <div class="grid" id="pGrid"></div>
    </div>

    <div class="modal" id="pModal">
        <div class="modal-header">
            <i class="fas fa-arrow-left" onclick="closeModal()"></i>
            <strong>Product Info</strong>
        </div>
        <div style="padding: 20px;">
            <img id="mImg" style="width: 100%; height: 250px; object-fit: contain;">
            <h2 id="mTitle" style="margin-top: 15px;"></h2>
            <h1 id="mPrice" style="color: #2874f0; margin: 10px 0;"></h1>
            <p id="mDesc" style="color: #666; line-height: 1.5;"></p>
            
            <div style="margin-top: 20px; border-top: 1px solid #eee; padding-top: 10px;">
                <p style="color: red; font-size: 0.8rem;">* Defect hone par turant WhatsApp par photo bhejein.</p>
            </div>
        </div>
        <button class="btn-buy" onclick="orderNow()">ORDER ON WHATSAPP</button>
    </div>

    <script>
        // Start App - Hide Welcome
        function startApp() {
            document.getElementById('welcome-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('welcome-screen').style.display = 'none';
            }, 800);
        }

        // Language Init
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage: 'hi'}, 'google_translate_element');
        }

        const products = [
            { id: 1, name: "Premium Bucket", price: 150, desc: "High quality durable plastic.", img: "https://images.unsplash.com/photo-1584622650111-993a426fbf0a?w=400" },
            { id: 2, name: "Storage Box", price: 280, desc: "Airtight for fresh food storage.", img: "https://images.unsplash.com/photo-1591195853828-11db59a44f6b?w=400" }
        ];

        let selected = null;

        function load() {
            document.getElementById('pGrid').innerHTML = products.map(p => `
                <div class="card" onclick="openP(${p.id})">
                    <img src="${p.img}">
                    <h4>${p.name}</h4>
                    <p style="color:green; font-weight:bold;">₹${p.price}</p>
                </div>
            `).join('');
        }

        function openP(id) {
            selected = products.find(p => p.id === id);
            document.getElementById('mImg').src = selected.img;
            document.getElementById('mTitle').innerText = selected.name;
            document.getElementById('mPrice').innerText = "₹" + selected.price;
            document.getElementById('mDesc').innerText = selected.desc;
            document.getElementById('pModal').style.display = 'block';
        }

        function closeModal() { document.getElementById('pModal').style.display = 'none'; }

        function orderNow() {
            const msg = `Order: ${selected.name} (Price: ₹${selected.price})`;
            window.open(`https://wa.me/917348698707?text=${msg}`);
        }

        load();
    </script>
</body>
</html>
