<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bharat Mart - Dudahi</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root { --primary: #2874f0; --secondary: #fb641b; --white: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #f1f3f6; padding-bottom: 20px; }

        /* Header */
        .header { background: var(--primary); color: white; padding: 12px 15px; position: sticky; top: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: center; }
        .logo-text { font-weight: 600; font-size: 1.1rem; letter-spacing: 0.5px; }
        
        /* Flipkart Style Category Bar */
        .category-bar { 
            background: white; 
            display: flex; 
            overflow-x: auto; 
            padding: 10px 5px; 
            gap: 15px; 
            border-bottom: 1px solid #ddd;
            scrollbar-width: none; /* Hide scrollbar for Chrome/Safari */
        }
        .category-bar::-webkit-scrollbar { display: none; }
        .cat-item { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-width: 70px; 
            cursor: pointer;
            text-align: center;
        }
        .cat-item i { 
            background: #f0f5ff; 
            color: var(--primary); 
            width: 45px; height: 45px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 1.2rem; 
            margin-bottom: 5px;
        }
        .cat-item span { font-size: 0.75rem; font-weight: 500; color: #333; }

        /* Sidebar (Three-Dot) */
        .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: white; z-index: 9000; transition: 0.3s; box-shadow: 2px 0 10px rgba(0,0,0,0.2); }
        .sidebar.active { left: 0; }
        .sidebar-header { background: var(--primary); color: white; padding: 20px; font-weight: 600; }
        .menu-item { padding: 15px 20px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 15px; cursor: pointer; color: #333; }
        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 8500; }

        /* Products Grid */
        .container { padding: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
        .card { background: white; border-radius: 8px; padding: 12px; text-align: center; border: 1px solid #eee; }
        .card img { width: 100%; height: 120px; object-fit: contain; }
        .card h4 { font-size: 0.85rem; margin-top: 10px; color: #444; height: 35px; overflow: hidden; }
        .price { color: #388e3c; font-weight: 600; margin-top: 5px; }

        /* Modal Details */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 9500; overflow-y: auto; }
        .modal-header { padding: 15px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 15px; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 55px; display: flex; z-index: 9600; }
        .btn-cart { flex: 1; background: white; border: none; font-weight: 600; border-top: 1px solid #ddd; }
        .btn-buy { flex: 1; background: var(--secondary); color: white; border: none; font-weight: 600; }
        
        .cart-badge { background: #ff6161; color: white; border-radius: 50%; padding: 2px 6px; font-size: 0.6rem; position: absolute; top: -5px; right: -8px; border: 1px solid white; }
    </style>
</head>
<body>

    <header class="header">
        <div onclick="toggleSidebar()" style="cursor:pointer;"><i class="fas fa-bars fa-lg"></i></div>
        <div class="logo-text">BHARAT MART</div>
        <div style="position:relative; cursor:pointer;">
            <i class="fas fa-shopping-cart fa-lg"></i>
            <span class="cart-badge" id="cartCount">0</span>
        </div>
    </header>

    <div class="category-bar">
        <div class="cat-item" onclick="filterCategory('all')">
            <i class="fas fa-border-all"></i><span>All</span>
        </div>
        <div class="cat-item" onclick="filterCategory('kitchen')">
            <i class="fas fa-utensils"></i><span>Kitchen</span>
        </div>
        <div class="cat-item" onclick="filterCategory('electronics')">
            <i class="fas fa-plug"></i><span>Electronic</span>
        </div>
        <div class="cat-item" onclick="filterCategory('home')">
            <i class="fas fa-couch"></i><span>Home</span>
        </div>
        <div class="cat-item" onclick="filterCategory('plastic')">
            <i class="fas fa-box"></i><span>Plastic</span>
        </div>
    </div>

    <div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header"><i class="fas fa-bars"></i> Menu</div>
        <div class="menu-item" id="google_translate_element"></div> <div class="menu-item" onclick="window.open('https://wa.me/917348698707')"><i class="fas fa-undo"></i> Return Policy</div>
        <div class="menu-item" onclick="window.open('https://wa.me/917348698707')"><i class="fas fa-headset"></i> Help Center</div>
    </div>

    <div class="container">
        <h4 id="catLabel" style="margin: 10px 0; color: #666; font-weight: 400;">All Products</h4>
        <div class="grid" id="productGrid"></div>
    </div>

    <div class="modal" id="pModal">
        <div class="modal-header">
            <i class="fas fa-arrow-left fa-lg" onclick="closeModal()"></i>
            <span style="font-weight:600;">Product Details</span>
        </div>
        <div style="padding:20px; text-align:center;">
            <img id="mImg" style="width:100%; height:250px; object-fit:contain;">
            <h2 id="mName" style="margin-top:15px; font-weight:500;"></h2>
            <h1 id="mPrice" style="color:var(--primary); margin:10px 0;"></h1>
            <p id="mDesc" style="color:#666; font-size:0.9rem; line-height:1.5;"></p>
        </div>
        <div class="bottom-nav">
            <button class="btn-cart" onclick="addToCart()">ADD TO CART</button>
            <button class="btn-buy" onclick="buyNow()">BUY NOW (WA)</button>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, cat: 'kitchen', name: "Plastic Bucket (20L)", price: 150, desc: "Best quality plastic bucket for daily use.", img: "https://images.unsplash.com/photo-1584622650111-993a426fbf0a?w=400" },
            { id: 2, cat: 'kitchen', name: "Container Set", price: 280, desc: "Airtight lids for kitchen storage.", img: "https://images.unsplash.com/photo-1591195853828-11db59a44f6b?w=400" },
            { id: 3, cat: 'electronics', name: "LED Torch", price: 249, desc: "High range rechargeable flashlight.", img: "https://m.media-amazon.com/images/I/61M9B4N-OML._SL1100_.jpg" },
            { id: 4, cat: 'home', name: "Aesthetic Door Mat", price: 120, desc: "Soft and stylish mat for home entry.", img: "https://images.unsplash.com/photo-1588600878108-578307a3cc9d?w=400" }
        ];

        let cartTotal = 0;
        let activeProduct = null;

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            const overlay = document.getElementById('overlay');
            overlay.style.display = overlay.style.display === 'block' ? 'none' : 'block';
        }

        function render(items) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = items.map(p => `
                <div class="card" onclick="openDetails(${p.id})">
                    <img src="${p.img}">
                    <h4>${p.name}</h4>
                    <p class="price">₹${p.price}</p>
                </div>
            `).join('');
        }

        function filterCategory(cat) {
            const filtered = cat === 'all' ? products : products.filter(p => p.cat === cat);
            render(filtered);
            document.getElementById('catLabel').innerText = cat.charAt(0).toUpperCase() + cat.slice(1) + " Items";
        }

        function openDetails(id) {
            activeProduct = products.find(p => p.id === id);
            document.getElementById('mImg').src = activeProduct.img;
            document.getElementById('mName').innerText = activeProduct.name;
            document.getElementById('mPrice').innerText = "₹" + activeProduct.price;
            document.getElementById('mDesc').innerText = activeProduct.desc;
            document.getElementById('pModal').style.display = 'block';
        }

        function closeModal() { document.getElementById('pModal').style.display = 'none'; }
        
        function addToCart() {
            cartTotal++;
            document.getElementById('cartCount').innerText = cartTotal;
            alert(activeProduct.name + " added to cart!");
        }

        function buyNow() {
            const msg = `*Order Detail*%0AProduct: ${activeProduct.name}%0APrice: ₹${activeProduct.price}`;
            window.open(`https://wa.me/917348698707?text=${msg}`);
        }

        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage: 'hi'}, 'google_translate_element');
        }

        window.onload = () => render(products);
    </script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
