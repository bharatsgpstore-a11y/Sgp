<!DOCTYPE html>
<header>
  <h2>Mini Flipkart</h2>
  <div>🛒 Cart: <span id="cartCount">0</span></div>
</header>

<div class="container">

  <!-- Categories -->
  <div class="categories">
    <h3>Categories</h3>
    <button onclick="loadProducts('Mobiles')">Mobiles</button>
    <button onclick="loadProducts('Fashion')">Fashion</button>
    <button onclick="loadProducts('Electronics')">Electronics</button>
  </div>

  <!-- Products -->
  <div class="products hidden" id="products">
    <h3 id="productTitle"></h3>
    <div id="productList"></div>
  </div>

  <!-- Cart -->
  <div class="cart hidden" id="cart">
    <h3>Cart</h3>
    <div id="cartItems"></div>
    <p><b>Total:</b> ₹<span id="totalPrice">0</span></p>
    <button onclick="showAddress()">Continue</button>
  </div>

  <!-- Address -->
  <div class="address hidden" id="address">
    <h3>Delivery Address</h3>
    <input id="name" placeholder="Full Name" />
    <input id="mobile" placeholder="Mobile Number" />
    <input id="house" placeholder="House / Building" />
    <input id="city" placeholder="City" />
    <input id="state" placeholder="State" />
    <input id="pincode" placeholder="Pincode" />
    <button onclick="showPayment()">Save & Continue</button>
  </div>

  <!-- Payment -->
  <div class="payment hidden" id="payment">
    <h3>Payment Method</h3>
    <select id="paymentMode">
      <option>Cash on Delivery</option>
      <option>UPI</option>
      <option>Debit Card</option>
    </select>
    <button onclick="placeOrder()">Place Order</button>
  </div>

  <!-- Order Success -->
  <div class="orders hidden" id="orders">
    <h3>Order Placed ✅</h3>
    <p>Your order has been placed successfully.</p>
  </div>

</div>

<script>
  const data = {
    Mobiles: [
      { name: 'Realme Phone', price: 12000 },
      { name: 'Samsung Phone', price: 15000 }
    ],
    Fashion: [
      { name: 'T-Shirt', price: 500 },
      { name: 'Jeans', price: 1200 }
    ],
    Electronics: [
      { name: 'Laptop', price: 45000 },
      { name: 'Headphones', price: 2000 }
    ]
  };

  let cart = [];

  function loadProducts(category) {
    document.getElementById('products').classList.remove('hidden');
    document.getElementById('productTitle').innerText = category;
    const list = document.getElementById('productList');
    list.innerHTML = '';
    data[category].forEach((item, index) => {
      list.innerHTML += `<div class="item">${item.name} - ₹${item.price} <button onclick="addToCart('${category}', ${index})">Add</button></div>`;
    });
  }

  function addToCart(category, index) {
    cart.push(data[category][index]);
    document.getElementById('cart').classList.remove('hidden');
    document.getElementById('cartCount').innerText = cart.length;
    renderCart();
  }

  function renderCart() {
    const cartItems = document.getElementById('cartItems');
    cartItems.innerHTML = '';
    let total = 0;
    cart.forEach(item => {
      total += item.price;
      cartItems.innerHTML += `<div>${item.name} - ₹${item.price}</div>`;
    });
    document.getElementById('totalPrice').innerText = total;
  }

  function showAddress() {
    document.getElementById('address').classList.remove
('hidden');
  }

  function showPayment() {
    document.getElementById('payment').classList.remove('hidden');
  }

  function placeOrder() {
    document.getElementById('orders').classList.remove('hidden');
    document.getElementById('payment').classList.add('hidden');
  }
</script>

</body>
</html>
